[package]
name = "paldex-locate"
description = "Discovers Palworld save directories across CrossOver, Whisky, and native Windows Steam installs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs.workspace = true
serde.workspace = true

# Steam records its own install path in the registry; assuming C: misses any
# other drive. Windows-only, so macOS builds never see it.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
