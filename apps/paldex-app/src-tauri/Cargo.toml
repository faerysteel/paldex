[package]
name = "paldex-app"
description = "Paldex — local-only Palworld save tracker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri's mobile targets link against a library, so the binary stays a thin shim.
name = "paldex_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
paldex-locate.workspace = true
paldex-sav.workspace = true
paldex-gvas.workspace = true
paldex-model.workspace = true
paldex-store.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
