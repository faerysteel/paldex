[workspace]
resolver = "2"
members = ["crates/*", "apps/paldex-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/faerysteel/paldex"

[workspace.dependencies]
paldex-locate = { path = "crates/paldex-locate" }
paldex-sav = { path = "crates/paldex-sav" }
paldex-gvas = { path = "crates/paldex-gvas" }
paldex-model = { path = "crates/paldex-model" }
repak-oodle = { path = "crates/repak-oodle" }
paldex-store = { path = "crates/paldex-store" }
paldex-data = { path = "crates/paldex-data" }

base64 = "0.22"
dirs = "6"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
